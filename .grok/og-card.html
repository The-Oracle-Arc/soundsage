<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <style>
    @font-face {
      font-family: "Playfair Display";
      src: url("og-fonts/PlayfairDisplay.ttf") format("truetype");
      font-weight: 100 900;
      font-style: normal;
      font-display: block;
    }
    html, body {
      margin: 0;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #0e0f0d;
    }
    .stage {
      box-sizing: border-box;
      width: 1200px;
      height: 630px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(ellipse 68% 58% at 50% 48%, #171915 0%, #0e0f0d 74%);
    }
    .lockup {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .title {
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-weight: 500;
      font-size: 108px;
      line-height: 0.94;
      letter-spacing: 0.18em;
      color: #f1efe8;
      text-align: center;
      margin: 0;
      padding: 0 0 0 0.18em;
      font-kerning: normal;
      font-feature-settings: "kern" 1, "liga" 0;
    }
    .sage {
      letter-spacing: 0.32em;
      padding-left: 0.32em;
      margin-top: 2px;
    }
    .hair {
      width: 72px;
      height: 1px;
      background: #9eae96;
      margin: 30px 0 16px;
      opacity: 0.92;
    }
    .wave {
      width: 340px;
      height: 26px;
      display: block;
      margin-bottom: 22px;
    }
    .sub {
      font-family: "Playfair Display", Georgia, "Times New Roman", serif;
      font-weight: 400;
      font-size: 15px;
      letter-spacing: 0.58em;
      padding-left: 0.58em;
      color: #c5c9bf;
      text-transform: uppercase;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="stage">
    <div class="lockup">
      <p class="title">SOUNDS</p>
      <p class="title sage">SAGE</p>
      <div class="hair"></div>
      <svg class="wave" viewBox="0 0 340 26" aria-hidden="true">
        <defs>
          <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#9eae96" stop-opacity="0" />
            <stop offset="0.16" stop-color="#9eae96" stop-opacity="0.88" />
            <stop offset="0.84" stop-color="#9eae96" stop-opacity="0.88" />
            <stop offset="1" stop-color="#9eae96" stop-opacity="0" />
          </linearGradient>
        </defs>
        <path
          d="M0 13 C 21.25 13, 21.25 5.5, 42.5 13 S 63.75 20.5, 85 13 S 106.25 5.5, 127.5 13 S 148.75 20.5, 170 13 S 191.25 5.5, 212.5 13 S 233.75 20.5, 255 13 S 276.25 5.5, 297.5 13 S 318.75 20.5, 340 13"
          fill="none"
          stroke="url(#fade)"
          stroke-width="1.35"
          stroke-linecap="round"
        />
      </svg>
      <p class="sub">Smart Audio</p>
    </div>
  </div>
</body>
</html>
